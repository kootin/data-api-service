services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U market"], interval: 5s, retries: 10 }
  mongo:
    image: mongo:7
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 10 }
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_DATABASE_URL: postgresql+psycopg://market:market@postgres:5432/market
      APP_MONGO_URL: mongodb://mongo:27017
      APP_API_KEYS: dev-key
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
