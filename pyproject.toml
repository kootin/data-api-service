[project]
name = "data-api-service"
version = "0.1.0"
description = "FastAPI market-data service over SQL (time series) and MongoDB (events)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic>=2.7",
    "pydantic-settings>=2.3", "pymongo>=4.8", "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "mongomock>=4.1", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]   # FastAPI's Depends() in defaults is idiomatic
